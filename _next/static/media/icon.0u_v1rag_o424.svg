<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Sunshine Global Trade">
  <!--
    The mark: a sun, for Sunshine, drawn in the same flat woodblock language as
    the Ajrakh motifs on the page — solid disc, eight blunt rays, no gradients
    and no fine detail, because a favicon is read at 16px where anything thinner
    than ~2px turns to mush.

    Painted on the paper ground rather than left transparent so it holds its
    shape against a dark browser tab as well as a light one.
  -->
  <rect width="32" height="32" rx="6" fill="#fbf7f0"/>
  <circle cx="16" cy="16" r="6.2" fill="#c2410c"/>
  <g stroke="#c2410c" stroke-width="3" stroke-linecap="round">
    <path d="M16 3.4v3.1M16 25.5v3.1M3.4 16h3.1M25.5 16h3.1"/>
    <path d="M7.1 7.1l2.2 2.2M22.7 22.7l2.2 2.2M24.9 7.1l-2.2 2.2M9.3 22.7l-2.2 2.2"/>
  </g>
</svg>
